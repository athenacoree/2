[project]
name = "care-clear-crew"
version = "0.1.0"
description = "CareClearCrew - Autonomous Medical Prior Authorization Product"
authors = [{ name = "CareClearCrew Team" }]
requires-python = ">=3.10,<=3.13"
dependencies = [
    "crewai[tools]>=0.152.0",
    "streamlit>=1.35.0",
    "reportlab>=4.2.0",
    "pypdf>=4.2.0",
    "chromadb>=0.5.0",
    "pydantic>=2.0.0",
    "docx2txt>=0.8",
    "litellm>=1.93.0",
    "psycopg2-binary>=2.9.12",
]

[project.scripts]
care_clear_crew = "care_clear_crew.main:run"
run_crew = "care_clear_crew.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
