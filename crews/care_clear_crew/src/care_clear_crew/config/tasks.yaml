patient_intake_task:
  description: >
    Extract and structure complete patient information from the provided medical documents and clinical files.
    Parse and document exactly:
    - Patient Name, ID/Policy reference, date of birth, age, gender.
    - Main symptoms, primary diagnosis, secondary diagnosis, date of diagnosis.
    - Detailed medical history, allergies, and currently active medications.
    Ensure everything is organized into a clean structured format.
  expected_output: >
    A structured record of the patient's demographics, clinical history, and symptoms.
  agent: patient_intake_agent

insurance_authorization_task:
  description: >
    Analyze the patient's diagnosis and requested procedure against the insurance policy document.
    Perform a complete clinical-policy cross-reference to:
    - Check if the requested procedure is covered.
    - Identify annual limits, applied deductibles, copays, and provider network rules.
    - Identify exclusions, pre-existing condition terms, and waiting periods.
    - Identify any missing documents or requisites required by the insurer's policy rules.
  expected_output: >
    A complete coverage verification analysis report detailing limits, exclusions, and missing clinical elements.
  agent: insurance_authorization_agent

clinical_scribing_task:
  description: >
    Convert any unstructured narratives, transcripts, or patient notes into highly formatted, standard clinical notes.
    Extract, standardize, and validate all relevant medical codes, explicitly locating:
    - ICD-10 diagnostic codes.
    - CPT procedure codes.
  expected_output: >
    Formatted clinical notes and a validated list of ICD-10 and CPT codes.
  agent: clinical_scribing_agent

decision_task:
  description: >
    Synthesize all clinical records, coverage verification, and coding analyses to perform an extensive evaluation
    of more than 100 points across the 7 mandatory categories:
    1. Datos del paciente (Evaluate at least 15 points: e.g., name, ID, date of birth, age, gender, primary/secondary diagnosis, diagnosis date, medical history, allergies, current medications, etc.)
    2. Cobertura de la póliza (Evaluate at least 15 points: e.g., procedure covered, annual limit, applied deductible, copay required, provider network, preauth required, exclusions, pre-existing conditions, waiting period, automatic renewal, etc.)
    3. Documentación presentada (Evaluate at least 15 points: e.g., medical referral, specialist notes, lab tests, medical imaging, hospitalization report, informed consent, treatment history, justification of procedure, alternatives considered, risk evaluation, etc.)
    4. Requisitos de la aseguradora (Evaluate at least 15 points: e.g., required documentation, response timeframe, application format, approval criteria, denial criteria, appeal procedure, insurer contact, accepted language, signature required, institutional seal, etc.)
    5. Cumplimiento y regulaciones (Evaluate at least 15 points: e.g., HIPAA compliance, privacy laws, GDPR, policy compliance, local regulations, medical licenses, center certifications, staff accreditations, security protocols, sensitive data handling, etc.)
    6. Análisis de riesgos (Evaluate at least 15 points: e.g., denial risk, appeal risk, compliance risk, fraud risk, administrative error risk, incomplete documentation risk, policy interpretation risk, regulatory update risk, partial approval risk, delay risk, etc.)
    7. Factores de decisión (Evaluate at least 15 points: e.g., medical urgency, clinical necessity, cost effectiveness, alternative available, scientific evidence, specialist opinion, insurer history, approval trend, geographic coverage, provider network, etc.)

    For each evaluated point, provide:
    - name: specific, descriptive name (e.g. 'Verificación de nombre de paciente', 'Riesgo de denegación por falta de RM')
    - value: parsed evidence or value (or 'No encontrado')
    - status: 'Cumple' or 'No Cumple'
    - explanation: concise reason for the status
    - source_excerpt: exact textual excerpt/fragment (max 300 characters) from the original loaded documents that supports the value and status. If no real evidence is found in the documents, this must be set exactly to 'No encontrado' (NEVER invent or hallucinate excerpts).
    - source_document: the filename from which this excerpt was extracted (or 'No encontrado' if there is no real evidence in the loaded documents).

    CRITICAL INSTRUCTION: If you do not find real, verifiable text/evidence in the loaded documents, the status must be 'No Cumple', and source_excerpt must be 'No encontrado'. Hallucinating or inventing evidence or excerpts is strictly prohibited.

    Generate a final decision ('Aprobado' or 'Denegado'), calculate a confidence score (0-100%), and produce a detailed explanation summary of the decision, key evidence supporting it, and user-actionable recommendations.
    {feedback}
  expected_output: >
    A fully structured JSON matching the DecisionReport schema with at least 105 total evaluated points across the 7 categories, final decision, confidence percentage, summary, evidence, and recommendations.
  agent: decision_agent

appeal_writing_task:
  description: >
    Based on the clinical decision report where the prior authorization request was 'Denegado', write a formal and persuasive medical appeal letter.
    You must:
    - Reference explicitly each of the points with status 'No Cumple' from the decision report.
    - Cite the relevant insurer policy rules, clinical guidelines, or standard medical guidelines for each failed point.
    - Suggest exactly what additional clinical documentation or correction the clinician, provider, or patient should submit to address the deficiency.
    - Draft the complete text of the appeal letter in a highly professional format including header, formal greeting, body paragraphs, and professional closing with a signature block.
    Ensure the letter is written entirely in Spanish and is highly persuasive, clear, and professional.
  expected_output: >
    A fully structured JSON matching the AppealLetter schema, containing the subject, body of the appeal letter in Spanish, and a list of cited points.
  agent: appeal_writer_agent

precheck_task:
  description: >
    Conduct a simulation or pre-check on the provided patient clinical case.
    Unlike a complete decision run, you do not need to evaluate all 105 points fully, but you must look at key requirements and:
    - Determine which critical points from the patient data, policy rules, and insurer requirements are covered vs missing ('No encontrado').
    - Calculate an overall approval probability percentage (0-100%) based on critical coverage.
    - List the missing critical items (status 'No encontrado'), sorted by their negative impact on the final approval probability (highest impact items first).
    - Provide clear, actionable recommendations on what documents, clinical notes, or clinical criteria must be uploaded/satisfied to increase this probability.
  expected_output: >
    A structured JSON matching the PrecheckReport schema detailing the calculated approval probability, list of missing critical items, and recommendations to improve.
  agent: decision_agent
